name: Release

# Tag a commit (e.g. `git tag v0.3.0 && git push origin v0.3.0`) to build installers for
# Windows and Linux and upload them to a GitHub Release. Builds are signed only once the
# signing secrets exist (see RELEASING.md); until then they are unsigned. The release is
# created as a DRAFT (see electron-builder.yml publish.releaseType) for manual review.
#
# macOS was red on v0.2.0 and v0.3.0 with `⨯ <projectDir> not a file`, fixed in the
# "Configure code-signing environment" step below. Cause: a GitHub secret that does not exist
# expands to an EMPTY STRING, and macPackager's guard is `cscLink == null` — which "" passes.
# electron-builder then ran resolveCscLinkPath("", projectDir), got the repo root, and rejected
# it for not being a file. Windows survived only because windowsSignToolManager treats empty as
# absent. $GITHUB_ENV cannot unset a variable, so the signing vars are no longer declared on the
# build step at all; they are exported only when they actually hold a value.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Export the signing secrets ONLY when they hold a value. Declaring them on the build
      # step directly is what broke macOS: an absent secret becomes "", which is not `== null`,
      # so electron-builder treated it as a real certificate path. Empty values must therefore
      # never be defined at all, and $GITHUB_ENV cannot unset — hence this step.
      - name: Configure code-signing environment
        shell: bash
        env:
          IN_CSC_LINK: ${{ secrets.CSC_LINK }}
          IN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          export_if_set() {
            local name="$1" value="$2"
            [ -n "$value" ] || return 0
            # Heredoc form: tolerates values containing newlines or '='.
            {
              echo "${name}<<__EOF_${name}__"
              echo "$value"
              echo "__EOF_${name}__"
            } >> "$GITHUB_ENV"
          }
          export_if_set CSC_LINK "${IN_CSC_LINK:-}"
          export_if_set CSC_KEY_PASSWORD "${IN_CSC_KEY_PASSWORD:-}"
          export_if_set APPLE_ID "${IN_APPLE_ID:-}"
          export_if_set APPLE_APP_SPECIFIC_PASSWORD "${IN_APPLE_APP_SPECIFIC_PASSWORD:-}"
          export_if_set APPLE_TEAM_ID "${IN_APPLE_TEAM_ID:-}"
          if [ -z "${IN_CSC_LINK:-}" ]; then
            # Without a certificate, stop electron-builder adopting some unrelated identity that
            # happens to be in the runner keychain; produce a clean unsigned build instead.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      # Tag builds publish to a draft release; a manual workflow_dispatch is a dry run, so the
      # workflow itself can be tested (this fix was verified that way) without cutting a release.
      - name: Build and publish installers
        if: github.ref_type == 'tag'
        run: npm run release
        env:
          # Provided automatically by Actions; lets electron-updater's github provider upload assets.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installers (dry run, no publish)
        if: github.ref_type != 'tag'
        run: npm run release:dry
      - name: Report signing status
        if: always()
        shell: bash
        run: |
          {
            echo "### Signing status (${RUNNER_OS})"
            case "$RUNNER_OS" in
              Windows)
                if [ -n "$HAS_CSC" ]; then
                  echo "- Windows artifacts: **signed** (CSC_LINK provided)"
                else
                  echo "- Windows artifacts: **unsigned** (no CSC_LINK secret; SmartScreen will warn)"
                fi
                ;;
              macOS)
                if [ -n "$HAS_CSC" ]; then
                  echo "- macOS artifacts: **signed** (CSC_LINK provided)"
                else
                  echo "- macOS artifacts: **unsigned** (no CSC_LINK secret; Gatekeeper will warn)"
                fi
                if [ -n "$HAS_APPLE_ID" ] && [ -n "$HAS_APPLE_PW" ] && [ -n "$HAS_APPLE_TEAM" ]; then
                  echo "- Notarization: **attempted** (Apple credentials provided; check build log for result)"
                else
                  echo "- Notarization: **skipped** (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID not all set)"
                fi
                ;;
              *)
                echo "- Linux artifacts are not code-signed; verify downloads against the SHA256SUMS file."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          HAS_CSC: ${{ secrets.CSC_LINK }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID }}
          HAS_APPLE_PW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HAS_APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      # Attach per-OS SHA-256 checksums so downloads are verifiable even while builds are
      # unsigned. Runs only for tag builds (the draft release exists then).
      - name: Attach checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd dist
          out="SHA256SUMS-${RUNNER_OS}.txt"
          : > "$out"
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.blockmap; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> "$out"
            else
              shasum -a 256 "$f" >> "$out"
            fi
          done
          if [ ! -s "$out" ]; then echo "No artifacts to checksum"; exit 0; fi
          cat "$out"
          gh release upload "${GITHUB_REF_NAME}" "$out" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
