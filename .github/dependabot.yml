version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per bucket instead of one per package — this repo has ~40 direct deps.
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Majors here are never drive-by work, so dependabot proposes minor/patch only and majors
      # get taken deliberately. Demonstrated by the first batch it opened: Vite 8 violates
      # electron-vite's peer range, Tailwind 4 is a rewrite (CSS-first config), react-dom 19 was
      # offered without React itself, and an Electron major breaks the better-sqlite3 ABI until
      # it is rebuilt. All four are real upgrades with migration work, not bumps.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      server-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types:
          - minor
          - patch
