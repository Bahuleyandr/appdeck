appId: dev.appdeck.app
productName: AppDeck
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  icon: build/icon.png
  target:
    # zip is required for electron-updater's MacUpdater; dmg is the user-facing installer.
    - zip
    - dmg
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  desktop:
    entry:
      # Register the appdeck:// deep-link handler in the desktop entry.
      MimeType: x-scheme-handler/appdeck
# Registers appdeck:// with the OS in packaged builds (CFBundleURLTypes on macOS).
protocols:
  - name: AppDeck
    schemes:
      - appdeck
publish:
  provider: github
  owner: Bahuleyandr
  repo: appdeck
  # CI publishes a draft release per tag; review the assets, then publish manually.
  releaseType: draft
