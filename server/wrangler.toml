name = "appdeck-sync"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Create the DB with `wrangler d1 create appdeck` and paste the returned id below.
[[d1_databases]]
binding = "DB"
database_name = "appdeck"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# TOKEN_SECRET is NOT set here — add it with `wrangler secret put TOKEN_SECRET`.

# Auth rate limiting (D1-backed fixed window, keyed on CF-Connecting-IP + route).
# The values below are also the code defaults; tune them per deployment.
[vars]
RATE_LIMIT_WINDOW_SECONDS = "600" # 10-minute window
RATE_LIMIT_AUTH_MAX = "10"        # login + auth-params attempts per IP per window (each route)
RATE_LIMIT_SIGNUP_MAX = "5"       # signups per IP per window
