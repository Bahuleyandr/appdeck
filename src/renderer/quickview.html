<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Second CSP layer, mirroring index.html. The session-level header CSP registered by
         createMainWindow does not reliably apply to file:// loads, and this window renders
         notification titles/bodies that originate from web content in service views. It
         needs no remote images, so img-src stays tighter than the main shell's. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppDeck Quick View</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/quickview/main.tsx"></script>
  </body>
</html>
