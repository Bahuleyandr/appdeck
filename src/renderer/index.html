<!doctype html>
<!-- Dark is the default palette in :root; the light theme is opted into by adding .light
     (see applyTheme). Tailwind 4 dropped the config-based `dark` class variant, so a class="dark"
     here would be inert and would mislead the next `dark:` utility someone writes. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: https:; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppDeck</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
